[project]
name = "tectonic-backend"
version = "0.1.0"
description = "Tectonic hackathon backend (FastAPI, in-memory store)"
requires-python = ">=3.12"
dependencies = [
    "agno>=3.0.11",
    "fastapi[standard]>=0.142.1",
    "google-genai>=2.25.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
